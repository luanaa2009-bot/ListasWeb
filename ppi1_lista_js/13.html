
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenho com Canvas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: white;
        }

        h1 {
            text-align: center;
        }

        canvas {
            border: 1px solid #000;
        }
    </style>
</head>

<body>

    <h1>Desenho com Canvas</h1>

    <canvas id="meuCanvas" width="400" height="300"></canvas>

    <script>

        // A) Obter o contexto 2D do Canvas
        const canvas = document.getElementById("meuCanvas");
        const ctx = canvas.getContext("2d");


        // B) Desenhar um retângulo azul
        ctx.fillStyle = "blue";
        ctx.fillRect(50, 50, 100, 50);


        // C) Desenhar um círculo vermelho
        ctx.beginPath();
        ctx.arc(200, 150, 30, 0, 2 * Math.PI);
        ctx.fillStyle = "red";
        ctx.fill();


        // D) Desenhar o texto Canvas!
        ctx.fillStyle = "black";
        ctx.font = "20px Arial";
        ctx.fillText("Canvas!", 120, 250);

    </script>

</body>
</html>
