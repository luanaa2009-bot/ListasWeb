
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title id="tituloaba">Cálculo de IMC</title>
</head>
<body align="center">

    <h1 id="titulo">Calculadora de IMC</h1>

    <p id="texto">Preencha seus dados para calcular seu IMC:</p>

    <label id="labelNome" for="nome">Nome:</label>
    <input type="text" id="nome">

    <br><br>

    <label id="labelPeso" for="peso">Peso (kg):</label>
    <input type="number" id="peso" step="0.1">

    <br><br>

    <label id="labelAltura" for="altura">Altura (m):</label>
    <input type="number" id="altura" step="0.01">

    <br><br>

    <button id="botao" onclick="calcularIMC()">Calcular</button>

    <h2 id="subtitulo">Resultado</h2>

    <p id="resultadoIMC"></p>

    <p id="classificacao"></p>

    <img id="imgPerfil" src="" alt="Imagem do perfil de IMC"
         width="150">

    <script id="codigo">

        function calcularIMC() {

            // Ler os dados do usuário
            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            // Verificar se os campos foram preenchidos
            if (nome === "" || document.getElementById("peso").value === "" ||
                document.getElementById("altura").value === "") {

                alert("Preencha todos os campos!");
                return;
            }

            // Verificar valores válidos
            if (peso <= 0 || altura <= 0 ||
                !Number.isFinite(peso) || !Number.isFinite(altura)) {

                alert("Digite valores válidos para peso e altura!");
                return;
            }

            // Calcular o IMC
            let imc = peso / (altura * altura);

            // Exibir o resultado
            document.getElementById("resultadoIMC").innerText =
                nome + ", seu IMC é: " + imc.toFixed(2);

            // Classificar usando IF / ELSE IF
            let classificacao = "";

            if (imc < 18.5) {

                classificacao = "Abaixo do peso";

            } else if (imc >= 18.5 && imc < 24.9) {

                classificacao = "Peso normal";

            } else if (imc >= 25 && imc < 29.9) {

                classificacao = "Sobrepeso";

            } else if (imc >= 30 && imc < 34.9) {

                classificacao = "Obesidade grau 1";

            } else if (imc >= 35 && imc < 39.9) {

                classificacao = "Obesidade grau 2";

            } else if (imc >= 40) {

                classificacao = "Obesidade grau 3 (mórbida)";

            } else {

                classificacao = "Faixa não especificada na tabela";

            }

            document.getElementById("classificacao").innerText =
                "Classificação: " + classificacao;

            // Escolher imagem usando SWITCH
            let faixa = Math.floor(imc);
            let imagem = "";

            switch (faixa) {

                case 0:
                case 1:
                case 2:
                case 3:
                case 4:
                case 5:
                case 6:
                case 7:
                case 8:
                case 9:
                case 10:
                case 11:
                case 12:
                case 13:
                case 14:
                case 15:
                case 16:
                case 17:
                case 18:
                    imagem = "./img/abaixopeso.png";
                    break;

                case 19:
                case 20:
                case 21:
                case 22:
                case 23:
                case 24:
                    imagem = "./img/normal.png";
                    break;

                case 25:
                case 26:
                case 27:
                case 28:
                case 29:
                    imagem = "./img/sobrepeso.png";
                    break;

                case 30:
                case 31:
                case 32:
                case 33:
                case 34:
                    imagem = "./img/obesidade1.png";
                    break;

                case 35:
                case 36:
                case 37:
                case 38:
                case 39:
                    imagem = "./img/obesidade2.png";
                    break;

                default:
                    imagem = "./img/obesidade3.png";
                    break;
            }

            // Exibir a imagem correspondente
            document.getElementById("imgPerfil").src = imagem;

        }

    </script>
 
</body>
</html>
