<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Autor: Seu Nome | Data: 29/09/2026 -->
  <nav>
    <a href="4_curriculo.html">Voltar ao currículo</a>
    <a href="1.html">Início</a>
  </nav>

  <h1>Entre em contato</h1>
  <p class="aviso">Preencha os campos e clique em Enviar. Campos com * são obrigatórios.</p>

  <form action="#" method="post">
    <label for="nome">Nome *</label>
    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

    <label for="email">E-mail *</label>
    <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>

    <label for="assunto">Assunto</label>
    <input type="text" id="assunto" name="assunto" placeholder="Sobre o que você quer falar?">

    <label for="estado">Estado</label>
    <select id="estado" name="estado">
      <option value="">Selecione...</option>
      <option value="SC">Santa Catarina</option>
      <option value="PR">Paraná</option>
      <option value="RS">Rio Grande do Sul</option>
      <option value="SP">São Paulo</option>
      <option value="RJ">Rio de Janeiro</option>
      <option value="MG">Minas Gerais</option>
    </select>

    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
