<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 – Barquinho no mar</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  .cena{position:relative;width:100%;height:100vh;background:linear-gradient(#4fc3f7 0%,#b3e5fc 60%,#fff8e1 100%);overflow:hidden}

  .sol{position:absolute;top:40px;right:80px;width:80px;height:80px;border-radius:50%;background:#ffe082;box-shadow:0 0 40px #ffd54f}

  .nuvem{position:absolute;top:80px;left:-250px;width:120px;height:40px;background:#fff;border-radius:50px;
    box-shadow:40px -20px 0 10px #fff,80px 0 0 0 #fff,-30px 5px 0 -5px #fff;opacity:.95;animation:nuvem 50s linear infinite}
  .nuvem.n2{top:170px;transform:scale(.6);animation-duration:80s;animation-delay:-30s}
  @keyframes nuvem{to{left:110%}}

  .mar{position:absolute;bottom:0;left:0;width:100%;height:40%;background:linear-gradient(#0288d1,#01579b);z-index:2}
  .mar::before,.mar::after{content:"";position:absolute;left:0;width:100%;height:40px;
    background:radial-gradient(circle at 25px 40px,transparent 22px,#29b6f6 23px,#29b6f6 26px,transparent 27px) 0 0/50px 40px repeat-x;
    animation:onda 6s linear infinite}
  .mar::before{top:-20px;z-index:1}
  .mar::after{top:25px;opacity:.6;animation-duration:9s;animation-direction:reverse}
  @keyframes onda{to{background-position:50px 0}}

  .barco-move{position:absolute;bottom:34%;left:-200px;z-index:3;animation:navega 25s linear infinite}
  @keyframes navega{to{left:110%}}
  .barco{width:160px;height:120px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 120'><polygon points='78,5 78,80 25,80' fill='%23fff'/><polygon points='84,20 84,80 130,80' fill='%23ffcc80'/><rect x='77' y='5' width='4' height='90' fill='%235d4037'/><path d='M10 85 H150 L130 115 H30 Z' fill='%23c62828'/></svg>") center/contain no-repeat;
    transform-origin:50% 90%;animation:balanco 3s ease-in-out infinite}
  @keyframes balanco{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(6px)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:200s!important}}
</style>
</head>
<body>
<div class="cena">
  <div class="sol"></div>
  <div class="nuvem"></div>
  <div class="nuvem n2"></div>
  <div class="barco-move"><div class="barco"></div></div>
  <div class="mar"></div>
</div>
</body>
</html>
